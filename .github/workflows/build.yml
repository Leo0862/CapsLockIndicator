name: Build

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      # Single self-contained exe: runs without installing the .NET runtime.
      - name: Publish
        run: >
          dotnet publish src/CapsLockIndicator/CapsLockIndicator.csproj
          -c Release -r win-x64 --self-contained true
          -p:PublishSingleFile=true -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish

      - uses: actions/upload-artifact@v4
        with:
          name: CapsLockIndicator-win-x64
          path: publish/CapsLockIndicator.exe
